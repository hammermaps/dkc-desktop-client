// Benachrichtigungen.
syntax = "proto3";

package dkc.api.v1;

option csharp_namespace = "DkcDesktopClient.Core.Protocol";

// NOTIFICATIONS-Anfrage. Leer (wie ältere Clients) = nur ungelesene, höchstens 10 – wie das
// Benachrichtigungs-Dropdown im Web. "read" entspricht browser_notifications.sent.
message NotificationsRequest {
    bool  include_read = 1; // auch gelesene, neueste zuerst (wie die Web-Seite „Benachrichtigungen“)
    int32 limit        = 2; // 0 = Standard (10, mit include_read 50), höchstens 100
}

message NotificationItem {
    int32  id         = 1;
    string type       = 2;
    string title      = 3;
    string message    = 4;
    bool   read       = 5;
    string created_at = 6;
}

message NotificationsResponse {
    bool                      authenticated = 1;
    int32                     count         = 2;
    repeated NotificationItem notifications = 3;
    string                    version       = 4;
}

message NotificationCountResponse {
    int32 count = 1;
}

// id = 0 marks ALL of the user's unread notifications as read.
message NotificationMarkReadRequest {
    int32 id = 1;
}
