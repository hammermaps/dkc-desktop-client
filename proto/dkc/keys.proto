// Schlüsselverwaltung.
syntax = "proto3";

package dkc.api.v1;

import "dkc/common.proto";

option csharp_namespace = "DkcDesktopClient.Core.Protocol";

message KeysInventoryRequest {
    string status = 1; // active | inactive | ""
    int32  limit  = 2;
    int32  offset = 3;
}

message KeyInventoryItem {
    int32  id          = 1;
    string number      = 2;
    string name        = 3;
    string description = 4;
    int32  type_id     = 5;
    int32  cabinet_id  = 6;
    int32  total_count = 7;
    int32  available   = 8;
    bool   enabled     = 9;
}

message KeysInventoryResponse {
    PageInfo                  page = 1;
    repeated KeyInventoryItem keys = 2;
}

message KeysIssuedRequest {
    int32 limit  = 1;
    int32 offset = 2;
}

message KeyIssuedItem {
    int32  id                = 1;
    int32  key_id             = 2;
    string key_name           = 3;
    string issued_to          = 4;
    string recipient_name     = 5;
    string issued_at          = 6;
    string returned_at        = 7;
    string notes              = 8;
    string planned_return_at  = 9; // date, "" if none set (rueckgabe_geplant); overdue = set + not yet returned + in the past
}

message KeysIssuedResponse {
    PageInfo               page   = 1;
    repeated KeyIssuedItem issued = 2;
}

// Full issue history for a single key (current + already-returned records) —
// KEYS_ISSUED only ever returns currently-issued (not-yet-returned) records.
message KeyIssueHistoryRequest {
    int32 key_id = 1;
    int32 limit  = 2;
    int32 offset = 3;
}

message KeyTypeItem {
    int32  id    = 1;
    string name  = 2;
    string color = 3;
    string icon  = 4;
}

message KeysTypesListResponse {
    repeated KeyTypeItem types = 1;
}

message KeyCabinetItem {
    int32  id       = 1;
    string name     = 2;
    string location = 3;
}

message KeysCabinetsListResponse {
    repeated KeyCabinetItem cabinets = 1;
}

message KeyInventorySaveRequest {
    int32  id          = 1; // 0 = create
    string number      = 2;
    string name        = 3;
    string description = 4;
    int32  type_id     = 5;
    int32  cabinet_id  = 6;
    int32  total_count = 7;
    bool   enabled     = 8;
}

message KeyCreateResponse { int32 id = 1; }

message KeyIssueRequest {
    int32  key_id    = 1;
    string issued_to = 2;
    string issued_at = 3;
    string notes     = 4;
}

message KeyIssueResponse { int32 id = 1; }

message KeyReturnRequest {
    int32  id          = 1; // id of the issued record
    string returned_at = 2;
    string notes       = 3;
}

message KeyDeleteRequest { int32 id = 1; }
