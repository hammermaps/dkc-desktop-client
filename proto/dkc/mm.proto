// Mängelmeldungen (defect reports) actions.
syntax = "proto3";

package dkc.api.v1;

import "dkc/common.proto";

option csharp_namespace = "DkcDesktopClient.Core.Protocol";

// MM_LIST ─────────────────────────────────────────────────────────────────────
message MmListRequest {
    // Optional filter on status (0..3). -1 = unset.
    int32  status = 1;
    string street = 2;
    int32  limit  = 3;
    int32  offset = 4;

    // Web-Pendant: MmCoreTrait::getMmData() Filter/Sortierung.
    string search          = 5; // Volltext über betreff/uid/melder/whg; "" = kein Filter
    string dringlichkeit   = 6; // niedrig|normal|hoch|kritisch; "" = alle
    int32  nachunternehmer = 7; // 0 = alle
    int32  year            = 8; // Filtert auf created_at im Jahr; 0 = alle
    // betreff|street|whg|melder|uid|dringlichkeit|status|created_at; "" = created_at (Default)
    string sort_column     = 9;
    bool   sort_ascending  = 10;
}

message MmMessage {
    string uid             = 1;
    int32  status          = 2;
    string betreff         = 3;
    int32  street          = 4;
    string whg             = 5;
    string melder          = 6;
    string datetime        = 7;
    string dringlichkeit   = 8;
    int32  nachunternehmer = 9;
    bool   scanned         = 10;
    string zugeh           = 11;

    // Web-Pendant: MmCoreTrait::getMmData() aufgelöste Anzeigewerte.
    string street_name          = 12;
    string nachunternehmer_name = 13;
    int32  followup_count       = 14;
}

message MmListResponse {
    PageInfo            page     = 1;
    repeated MmMessage  messages = 2;
}

// MM_DETAIL ───────────────────────────────────────────────────────────────────
message MmDetailRequest { string uid = 1; }

message MmDetail {
    string uid              = 1;
    int32  status           = 2;
    string betreff          = 3;
    string meldung_massage  = 4;
    int32  street           = 5;
    string whg              = 6;
    string melder           = 7;
    string tel              = 8;
    string email            = 9;
    string datetime         = 10;
    string dringlichkeit    = 11;
    int32  nachunternehmer  = 12;
    bool   scanned          = 13;
    string zugeh            = 14;
    string zeit             = 15;
    string planon           = 16;
    repeated string instructions = 17;

    string street_name          = 18;
    string nachunternehmer_name = 19;

    // Freigabe-/Prüfungs-Workflow-Felder (Web-Pendant: mm_view.tpl / MmUpdateStatusRequest oben).
    string ekpreis          = 20;
    string folge             = 21;
    string auftragsnummer    = 22;
    string akt_nr             = 23;
}

// Web-Pendant: ContMm::$additional_instructions (system\helper\MmInstructionOptions).
// Feste, projektunabhängige Liste — wird bei jeder MM_DETAIL-Antwort mitgeliefert, damit
// der Client die in MmDetail.instructions gespeicherten IDs mit Klartext anzeigen kann.
message MmInstructionOption {
    string id   = 1;
    string text = 2;
}

message MmDetailResponse {
    MmDetail                     message               = 1;
    repeated MmInstructionOption available_instructions = 2;
}

// MM_CREATE / MM_UPDATE ───────────────────────────────────────────────────────
message MmSaveRequest {
    // For MM_UPDATE, set `uid`; for MM_CREATE leave empty.
    string uid              = 1;
    string betreff          = 2;
    string meldung_massage  = 3;
    string street           = 4;
    string whg              = 5;
    string melder           = 6;
    string tel              = 7;
    string email            = 8;
    string dringlichkeit    = 9;
    string nachunternehmer  = 10;
    string zugeh            = 11;
}

message MmCreateResponse { string uid = 1; }

// MM_UPDATE_STATUS ────────────────────────────────────────────────────────────
// Web-Pendant: MmCoreTrait::changeStatus() — enthält bewusst NICHT den E-Mail-Versand
// an Verwaltung/Nachunternehmer/Mieter (siehe MmUpdateStatusHandler), nur die
// Kernlogik + die Freigabe-/Prüfungs-Workflow-Felder aus dem Status-/Prüfungs-Modal.
message MmUpdateStatusRequest {
    string uid     = 1;
    int32  status  = 2;
    string comment = 3;

    // Nur bei status 0 (Freigabe) / 1 (Freigegeben) relevant; 0 = unverändert lassen.
    int32  nachunternehmer  = 4;
    // "" = unverändert lassen. Web validiert client- UND serverseitig als Dezimalzahl.
    string ekpreis           = 5;
    string planon_gruppe     = 6;
    // IDs aus MmInstructionOption.id (MmDetailResponse.available_instructions).
    // Nur bei status 0/1 ausgewertet; ersetzt die gespeicherte Auswahl vollständig
    // (leere Liste = keine Zusatzanweisungen), der Client sendet daher immer den
    // vollständigen aktuellen Checkbox-Zustand, nicht nur Änderungen.
    repeated string instructions = 7;
    // Pflicht-Folgemaßnahmen-Text (Web: bei Ablehnung aus der Prüfung Pflichtfeld).
    string folge              = 8;
    // Nur bei status 3 (Erledigt); Format wird serverseitig geprüft (P700+Ziffern
    // oder 7–10-stellige Ziffernfolge), ungültige Werte werden ignoriert wie im Web.
    string auftragsnummer     = 9;
    // Freigabe-Akt-Nr.; wenn gesetzt, werden freigabe_datum/-user mit aktualisiert.
    string akt_nr             = 10;
}

// MM_ASSIGN_CONTRACTOR ────────────────────────────────────────────────────────
message MmAssignContractorRequest {
    string uid             = 1;
    string nachunternehmer = 2;
}

// MM_DELETE ───────────────────────────────────────────────────────────────────
message MmDeleteRequest { string uid = 1; }
