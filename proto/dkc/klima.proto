// Klima / HVAC.
syntax = "proto3";

package dkc.api.v1;

option csharp_namespace = "DkcDesktopClient.Core.Protocol";

message KlimaDevice {
    int32  address  = 1;
    string name     = 2;
    int32  group_id = 3;
    bool   enabled  = 4;
    int32  sort     = 5;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id = 6;
}

message KlimaDevicesResponse {
    repeated KlimaDevice devices = 1;
}

message KlimaStatusDevice {
    int32  address        = 1;
    string name           = 2;
    bool   enabled        = 3;
    int32  group_id       = 4;
    string operating_mode = 5;
    string note           = 6;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id  = 7;
}

message KlimaStatusResponse {
    repeated KlimaStatusDevice devices = 1;
}

message KlimaRealtimeStatusDevice {
    int32  address        = 1;
    string name           = 2;
    bool   online         = 3;
    bool   power          = 4;
    string operating_mode = 5;
    double setpoint       = 6;
    double current_temp   = 7;
    string fan_speed      = 8;
    string error_code     = 9;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id  = 10;
}

message KlimaRealtimeStatusResponse {
    string                              timestamp = 1;
    repeated KlimaRealtimeStatusDevice  devices   = 2;
}

message KlimaDeviceControlRequest {
    int32  address   = 1;
    bool   power     = 2;
    string mode      = 3;
    double setpoint  = 4;
    string fan_speed = 5;
    // Use *_set flags to distinguish "no change" from explicit 0/false.
    bool   power_set    = 6;
    bool   setpoint_set = 7;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id = 8;
}

message KlimaGroupControlRequest {
    int32  group_id  = 1;
    bool   power     = 2;
    string mode      = 3;
    double setpoint  = 4;
    string fan_speed = 5;
    bool   power_set    = 6;
    bool   setpoint_set = 7;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id = 8;
}

message KlimaGroup {
    int32  id           = 1;
    string name         = 2;
    int32  device_count = 3;
    // Climatic-Controller (0 = Controller 1, Bestand). Gruppen gelten je Controller.
    int32  controller_id = 4;
}

message KlimaGroupsResponse {
    repeated KlimaGroup groups = 1;
}

message KlimaDeviceUpdateRequest {
    int32  address     = 1;
    string name        = 2;
    int32  group_id    = 3;
    bool   enabled     = 4;
    int32  sort        = 5;
    // *_set markers: which fields were explicitly provided.
    bool   name_set     = 6;
    bool   group_id_set = 7;
    bool   enabled_set  = 8;
    bool   sort_set     = 9;
    // Climatic-Controller (0 = Controller 1, Bestand). Adressen/Gruppen gelten je Controller.
    int32  controller_id = 10;
}
