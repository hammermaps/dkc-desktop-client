// Auth and user-token actions.
syntax = "proto3";

package dkc.api.v1;

option csharp_namespace = "DkcDesktopClient.Core.Protocol";

// ── AUTH_LOGIN ───────────────────────────────────────────────────────────────
message AuthLoginRequest {
    string username     = 1;
    string password     = 2;
    string token_name   = 3; // default "DKC Desktop"
    int32  ttl_days     = 4; // 0 = no expiry
    string device_token = 5; // from an earlier trust_device; skips the second factor
}

// With two-factor authentication active, AUTH_LOGIN returns no token but
// requires_2fa = true, a pending ticket (valid 5 minutes) and the confirmed
// methods; continue with AUTH_SEND_2FA_CODE (email/sms) and AUTH_VERIFY_2FA.
message AuthLoginResponse {
    string          token              = 1; // dkc_<64-hex>, empty while requires_2fa
    string          token_type         = 2; // "Bearer"
    string          expires_at         = 3; // ISO-8601 or empty
    UserInfo        user               = 4;
    bool            requires_2fa       = 5;
    string          pending_2fa_ticket = 6;
    repeated string two_factor_methods = 7; // totp | email | sms | backup_codes
    string          device_trust_token = 8; // only from AUTH_VERIFY_2FA with trust_device
}

// ── AUTH_VERIFY_2FA ──────────────────────────────────────────────────────────
// Response: AuthLoginResponse with the issued token. Five wrong codes within
// 15 minutes lock code entry for the account (RATE_LIMITED), from any IP.
message AuthVerify2faRequest {
    string pending_2fa_ticket = 1;
    string method             = 2; // totp | email | sms | backup_codes
    string code               = 3;
    bool   trust_device       = 4; // remember this device for 30 days
    string token_name         = 5;
    int32  ttl_days           = 6;
}

// ── AUTH_SEND_2FA_CODE ───────────────────────────────────────────────────────
// Response: Ack. Sends an email/SMS code (valid 10 minutes, at most one new
// code per 15 minutes).
message AuthSend2faCodeRequest {
    string pending_2fa_ticket = 1;
    string method             = 2; // email | sms
}

// ── AUTH_LOGOUT / AUTH_STATUS / USER_INFO ────────────────────────────────────
message AuthStatusResponse {
    bool     authenticated = 1;
    UserInfo user          = 2;
}

message UserInfo {
    int32  id                = 1;
    string username          = 2;
    string vname             = 3;
    string nname             = 4;
    string email             = 5;
    bool   is_admin          = 6;
    int32  active_project_id = 7;
}

message UserInfoResponse {
    UserInfo            user        = 1;
    map<string, bool>   permissions = 2;
}

// ── USER_TOKENS_LIST / USER_TOKEN_DELETE ─────────────────────────────────────
message UserTokenItem {
    int32  id           = 1;
    string name         = 2;
    string created_at   = 3;
    string expires_at   = 4;
    string last_used_at = 5;
    string last_ip      = 6;
}

message UserTokensListResponse {
    repeated UserTokenItem tokens = 1;
}

message UserTokenDeleteRequest {
    int32 token_id = 1;
}

// ── USER_CHANGE_PASSWORD ──────────────────────────────────────────────────────
message ChangePasswordRequest {
    string current_password = 1;
    string new_password     = 2;
}
