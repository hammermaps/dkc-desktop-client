name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            asset_name: DkcDesktopClient-linux-x64
          - os: windows-latest
            rid: win-x64
            asset_name: DkcDesktopClient-win-x64.exe
          - os: macos-latest
            rid: osx-x64
            asset_name: DkcDesktopClient-osx-x64
          - os: macos-latest
            rid: osx-arm64
            asset_name: DkcDesktopClient-osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DkcDesktopClient.slnx

      - name: Build
        run: dotnet build DkcDesktopClient.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DkcDesktopClient.Tests/DkcDesktopClient.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Set version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Muss mit der Version übereinstimmen, die der "Deploy continuous
            # build"-Schritt unten an desktop_app_deploy meldet - sonst meldet
            # sich jede frisch aktualisierte Binärdatei selbst als "1.0.0" und
            # der Updater haelt sie faelschlich fuer veraltet.
            echo "value=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Publish
        run: dotnet publish DkcDesktopClient.App/DkcDesktopClient.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.value }} --output ./publish/${{ matrix.rid }}

      - name: Rename binary (Linux / macOS)
        if: matrix.rid == 'linux-x64' || startsWith(matrix.rid, 'osx-')
        run: mv ./publish/${{ matrix.rid }}/DkcDesktopClient.App ./publish/${{ matrix.rid }}/${{ matrix.asset_name }}

      - name: Rename binary (Windows)
        if: matrix.rid == 'win-x64'
        run: Rename-Item -Path ./publish/${{ matrix.rid }}/DkcDesktopClient.App.exe -NewName ${{ matrix.asset_name }}
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dkc-desktop-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/${{ matrix.asset_name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ./publish/${{ matrix.rid }}/${{ matrix.asset_name }}

      # Bei jedem Push auf main wird zusätzlich zum GitHub-Release-Pfad (nur bei
      # Tags) der aktuelle Stand für Linux/Windows direkt im DKC veröffentlicht -
      # analog zum TWS-App-Android-Auto-Deploy (siehe
      # external-apps/TWS-App/.github/workflows/deploy-android.yml). Download für
      # Nutzer: https://dkc.dk-automation.de/?page=admin&action=desktop_app.
      # Benötigtes Repository-Secret: DESKTOP_APP_DEPLOY_TOKEN (muss mit dem Wert
      # von DESKTOP_APP_DEPLOY_TOKEN in der .env des ProxyServer übereinstimmen).
      - name: Deploy continuous build to DKC (Linux/Windows)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (matrix.rid == 'linux-x64' || matrix.rid == 'win-x64')
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.DESKTOP_APP_DEPLOY_TOKEN }}
        run: |
          platform="linux"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then platform="windows"; fi

          # Dieselbe Version wie im Binary selbst (-p:Version= im Publish-Schritt),
          # damit der Updater die hochgeladene Version korrekt mit der laufenden
          # Binärdatei vergleichen kann.
          deploy_version="${{ steps.version.outputs.value }}"
          commit_sha="${{ github.sha }}"
          notes="${{ github.event.head_commit.message }}"

          status=$(curl -sS -o response.txt -w "%{http_code}" -X POST "https://dkc.dk-automation.de/api.php?action=desktop_app_deploy" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -F "binary=@./publish/${{ matrix.rid }}/${{ matrix.asset_name }}" \
            -F "platform=${platform}" \
            -F "version=${deploy_version}" \
            -F "commit_sha=${commit_sha}" \
            -F "notes=${notes}")
          echo "HTTP-Status: ${status}"
          cat response.txt
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: ./release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
